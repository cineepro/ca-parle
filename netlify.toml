[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Headers anti-cache Service Worker & index.html
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Content-Type = "application/javascript; charset=utf-8"

[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Content-Type = "application/javascript; charset=utf-8"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# 1. Redirection 301 stricte de kinemao.netlify.app vers le domaine propre kinemaplus.com
[[redirects]]
  from = "https://kinemao.netlify.app/*"
  to = "https://kinemaplus.com/:splat"
  status = 301
  force = true

# 2. Redirection des routes SPA pour React Router (doit rester en dernier)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200