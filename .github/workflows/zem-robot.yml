name: Robot Zem

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: crawler
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: crawler/package-lock.json
      - run: npm ci
      - run: npm test
      - run: node crawl.js
        env:
          APPWRITE_ENDPOINT: ${{ secrets.APPWRITE_ENDPOINT }}
          APPWRITE_PROJECT_ID: ${{ secrets.APPWRITE_PROJECT_ID }}
          APPWRITE_API_KEY: ${{ secrets.ZEM_APPWRITE_API_KEY }}
          DATABASE_ID: ${{ secrets.DATABASE_ID }}
          COLLECTION_SEARCH_SOURCES: ${{ secrets.COLLECTION_SEARCH_SOURCES }}
          COLLECTION_SEARCH_DOCUMENTS: ${{ secrets.COLLECTION_SEARCH_DOCUMENTS }}
          ZEM_MAX_MINUTES: '20'
          ZEM_USER_AGENT: ${{ vars.ZEM_USER_AGENT }}